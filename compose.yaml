services:
  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 75s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [internal, monitoring_access]
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [internal, api_access]
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrapulse}
      POSTGRES_USER: ${POSTGRES_USER:-infrapulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

volumes:
  postgres_data:

networks:
  monitoring_access:
    driver: bridge
  api_access:
    driver: bridge
  internal:
    internal: true
