[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapulse-api"
version = "0.1.0"
description = "InfraPulse API Reliability & Observability Platform"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.26,<0.27",
    "opentelemetry-api>=1.45.2,<1.46",
    "opentelemetry-sdk>=1.45.2,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<1.46",
    "httpcore[asyncio]>=1.0.9,<1.1",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "mypy>=1.14,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated PostgreSQL test container"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
