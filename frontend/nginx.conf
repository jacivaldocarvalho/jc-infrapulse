worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  # Route bodies, query strings and monitored destinations never enter access logs.
  log_format safe escape=json '{"event":"frontend_request","method":"$request_method","status":$status,"duration":$request_time}';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ready"}'; }
    location = /api/v1/services {
      limit_except GET POST { deny all; }
      include /etc/nginx/functional-proxy.conf;
    }
    location ~ "^/api/v1/services/[0-9a-fA-F-]{36}$" {
      limit_except GET PATCH DELETE { deny all; }
      include /etc/nginx/functional-proxy.conf;
    }
    location ~ "^/api/v1/services/[0-9a-fA-F-]{36}/(status|checks|metrics)$" {
      limit_except GET { deny all; }
      include /etc/nginx/functional-proxy.conf;
    }
    # No generic proxy, diagnostics, metrics listeners or upstream selection.
    location ~ ^/(api|metrics|health|ready|healthz|docs|redoc|openapi\.json|worker|prometheus|tempo|alertmanager|grafana|otel)(/|$) { return 404; }
    location ~ /\. { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
