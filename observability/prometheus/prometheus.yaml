global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: infrapulse-api
    static_configs:
      - targets: [api:9000]
  - job_name: infrapulse-worker
    static_configs:
      - targets: [worker:9001]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
