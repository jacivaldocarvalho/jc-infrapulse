route:
  receiver: local-only
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: local-only
      matchers: ['severity="critical"']
    - receiver: local-only
      matchers: ['severity="warning"']
receivers:
  - name: local-only
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [job, instance]
